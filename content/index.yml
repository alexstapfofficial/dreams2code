about:
  title: 'Hi, ich bin [Alex]{.text-primary} – der kreative Kopf hinter dreams2code.'
  part1: 'Meine Mission ist es, Selbstständigen und kleinen Unternehmen zu einem zeitgemäßen Webauftritt zu verhelfen. Viel zu oft sehe ich großartige lokale Betriebe mit veralteten Websites, die ihrem Angebot einfach nicht mehr gerecht werden. Dabei verdienen diese Unternehmen ein digitales Aushängeschild, das die Qualität ihrer Produkte und Dienstleistungen widerspiegelt.'
  part2: 'Warum das so selten der Fall ist, liegt auf der Hand: Professionelle Agenturen sind oft zu teuer – schnell landet man im fünfstelligen Bereich. Die Alternative? Baukastensysteme mit Standarddesigns, selbstgeschriebenen Texten und generischen Vorlagen. Verständlich, aber: Wirklich gutes Webdesign braucht mehr. Es beeinflusst, wie ein Unternehmen wahrgenommen wird – und das sollte niemals dem Zufall überlassen werden.'
  part3: 'Die Anforderungen an moderne Websites sind gestiegen: Mobile Optimierung, schnelle Ladezeiten, durchdachte Farb- und Schriftwahl, SEO – für all das gibt es inzwischen eigene Fachrichtungen. Das macht viele Projekte kompliziert und teuer.'
  part4: 'Genau hier setzt dreams2code an: Ich arbeite nicht hochspezialisiert, sondern als Allrounder – mit einem Blick für das große Ganze. Bei mir bekommst du kein Agentur-Mammutprojekt, aber deutlich mehr als ein Website-Baukasten je leisten kann. Ich biete dir ein stabiles Fundament für deinen digitalen Auftritt – mit Raum zum Wachsen, so wie dein Unternehmen.'
  image:
    src: '/images/Alex.webp'
    alt: 'Webdesign & Entwicklung aus Unterfranken'
section:
  title: Was ist Ihre [Website]{.text-primary} wert, wenn sie niemand findet?
  description: Viele Websites sehen hübsch aus, aber sind zu langsam, nicht mobilfähig oder bei Google unsichtbar.
  images:
    mobile: /images/google.png
    desktop: /images/google.png
  features:
    - title: Webdesign mit Konzept
      description: Maßgeschneiderte Layouts statt generischer Vorlagen.
      class: border-l border-primary pl-4
    - title: Responsive Design
      description: Ihre Website sieht auf Handy, Tablet & Desktop perfekt aus.
      class: border-l border-default pt-4 pl-4
    - title: SEO-optimiert
      description: Ihre Zielgruppe findet Sie über Google – nicht nur zufällig.
      class: border-l border-default pt-4 pl-4
    - title: Schnelle Ladezeiten
      description: Performance ist Rankingfaktor – ich sorge dafür
      class: border-l border-default pt-4 pl-4
    - title: Pflege und Weiterentwicklung
      description: Ich kümmere mich um Ihre Website, damit Sie sich um Ihr Geschäft kümmern können.
      class: border-l border-default pt-4 pl-4
features:
  title: In der [Zusammenarbeit]{.text-primary} enthalten
  description: Ich entwickle Ihre Website mit einem klaren Konzept, das auf Ihre Zielgruppe abgestimmt ist. Dabei achte ich auf die aufgeführten technischen Punkte um Ihre Marke zu stärken und Ihre Zielgruppe zu erreichen.
  features:
    - title: Individuelles Webdesign
      description: Ihre Website ist einzigartig – genau wie Ihr Unternehmen. Ich entwickle Designs und Texte, die Ihre Marke widerspiegeln und Vertrauen schaffen.
      icon: i-lucide-wand-sparkles
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Responsives Layout
      description: Immer mehr Menschen besuchen Websites mit dem Smartphone. Ich sorge dafür, dass Ihre Seite überall gut aussieht und funktioniert.
      icon: i-lucide-monitor-smartphone
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Suchmaschinenoptimierung (SEO)
      description: Schon beim Bau Ihrer Website optimiere ich Ladezeiten, Struktur und Inhalte – damit Sie bei Google gefunden werden.
      icon: i-lucide-search
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Performance & Technik
      description: Ich setze moderne Technologien ein, achte auf sauberen Code, schnelle Ladezeiten und langfristige Wartbarkeit.
      icon: i-lucide-code
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Pflege & Weiterentwicklung
      description: Eine Website ist nie „fertig“. Ich betreue Ihre Seite langfristig und kümmere mich um Updates, Backups und neue Features.
      icon: i-lucide-laptop
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Benutzerfreundlichkeit
      description: Ich achte darauf, dass Ihre Website einfach zu bedienen ist. So finden Ihre Kunden schnell, was sie suchen.
      icon: i-lucide-user
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
