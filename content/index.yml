seo:
  title: Dreams2Code - Webdesign & Entwicklung aus Unterfranken
  description: Dreams2Code ist eine Webdesign- und Entwicklungsagentur aus Unterfranken, die sich auf die Erstellung von modernen, benutzerfreundlichen Websites spezialisiert hat.
  keywords: Webdesign, Entwicklung, Unterfranken, moderne Websites, benutzerfreundliche Websites
title: '[Websiten]{.text-primary} technisch stark, optisch überzeugend.'
description: „Für Unternehmen, die auch online zeigen wollen, was sie wirklich können. Weil es für den ersten Eindruck keine zweite Chance gibt.“
image:
  src: /images/hero_dreams2code.webp
  alt: Webdesign & Entwicklung aus Unterfranken
hero:
  links:
    - label: kostenloses Erstgespräch
      icon: i-lucide-message-square-plus
      trailing: true
      variant: solid
      to: '#'
      target: _blank
      size: xl
about:
  title: 'Hi, ich bin [Alex]{.text-primary} – der kreative Kopf hinter dreams2code.'
  part1: 'Ich erinnere mich an einen kleinen Handwerksbetrieb in meiner Nachbarschaft: erstklassige Arbeit, tolles Team, spürbare Leidenschaft. Aber die Website? Veraltet, unübersichtlich, nicht mobilfähig.'
  part2: 'Ich dachte: Schade. Wer euch online sieht, hat keine Ahnung, wie gut ihr wirklich seid.'
  part3: 'Seitdem sehe ich sie überall: großartige lokale Unternehmen, die online nicht mithalten – nicht, weil sie schlecht sind, sondern weil Zeit, Know-how oder Budget fehlen. Und genau das ist der Grund, warum ich dreams2code gegründet habe.'
  part4: 'Ich kümmere mich um Ihren [Webauftritt]{.text-primary} – damit Sie sich auf das konzentrieren, was Sie am besten können: Ihr [Tagesgeschäft]{.text-primary}.'
  image:
    src: '/images/Alex.webp'
    alt: 'Webdesign & Entwicklung aus Unterfranken'
section:
  title: 'Was eine veralterte [Website]{.text-primary} heute über Ihr Unternehmen verrät – und warum das [gefährlich]{.text-primary} sein kann:'
  description: 'Ein potenzieller Kunde googelt Ihr Unternehmen. Er klickt auf Ihre Website – und was er sieht, wirkt wie aus einem anderen Jahrzehnt: unscharfe Bilder, schwer lesbarer Text am Handy, Ladezeit wie in der Steinzeit. Kein SSL, keine klare Botschaft, keine moderne Optik. Er zögert. Er fragt sich: „Ist dieses Unternehmen überhaupt noch aktiv? Professionell? Vertrauenswürdig?“ Und er klickt weiter – zur Konkurrenz.'
  images:
    mobile: /images/google.png
    desktop: /images/google.png
  features:
    - title: Sicherheitsrisiko
      description: Warnhinweise im Browser durch fehlendes SSL-Zertifikat lassen Ihr Unternehmen sofort unseriös erscheinen.
      class: border-l border-primary pl-4
    - title: Keine Optimierung für Mobilgeräte
      description: Nicht mobil optimierte Seiten sind auf dem Smartphone kaum lesbar und damit praktisch unbrauchbar.
      class: border-l border-primary pl-4
    - title: Schlechte Performance
      description: Lange Ladezeiten führen dazu, dass Besucher abspringen, noch bevor Ihre Inhalte überhaupt sichtbar sind.
      class: border-l border-default pt-4 pl-4
    - title: Keine SEO-Optimierung
      description: Das sorgt dafür, dass Sie bei Google gar nicht erst gefunden werden.
      class: border-l border-default pt-4 pl-4
    - title: DSGVO-Verstöße
      description: Unvollständige oder fehlende Rechtstexte wie Impressum und Datenschutzerklärung machen Ihre Seite zur Abmahnfalle.
      class: border-l border-default pt-4 pl-4
    - title: Schwache Texte
      description: Texte, die nur von Ihnen handeln, aber nicht den Kunden abholen, überzeugen nicht, sie verkaufen nicht.
      class: border-l border-default pt-4 pl-4
features:
  title: 'Ihr [Webauftritt]{.text-primary} soll verkaufen, nicht [abschrecken]{.text-primary}'
  description: 'Genau deshalb habe ich ein durchdachtes Leistungspaket geschnürt, das gezielt auf die typischen Schwachstellen veralteter Websites eingeht: technisch, visuell und inhaltlich. Keine überteuerten Agenturpakete, keine Standard-Baukästen, sondern ein ehrlicher, klarer Ansatz für moderne, wirksame Websites. Ob Ihre Seite einen frischen Look braucht, besser auf Google gefunden werden soll oder einfach wieder Vertrauen schaffen soll – ich bringe sie auf den neuesten Stand. Passend zu Ihrem Unternehmen. Verständlich. Und zukunftssicher.'
  features:
    - title: Individuelles Webdesign
      description: Ihre Website ist einzigartig – genau wie Ihr Unternehmen. Ich entwickle Designs und Texte, die Ihre Marke widerspiegeln und Vertrauen schaffen.
      icon: i-lucide-wand-sparkles
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Verkaufszentrierte Texte
      description: Ich schreibe Texte, die Ihre Zielgruppe ansprechen und überzeugen. So gewinnen Sie neue Kunden und steigern Ihren Umsatz.
      icon: i-lucide-brain
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Responsives Layout
      description: Immer mehr Menschen besuchen Websites mit dem Smartphone. Ich sorge dafür, dass Ihre Seite überall gut aussieht und funktioniert.
      icon: i-lucide-monitor-smartphone
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Suchmaschinenoptimierung (SEO)
      description: Schon beim Bau Ihrer Website optimiere ich Ladezeiten, Struktur und Inhalte – damit Sie bei Google gefunden werden.
      icon: i-lucide-search
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Sicherheitszertifikat
      description: Ihre Website wird mit einem SSL-Zertifikat ausgestattet. So sind Ihre Daten und die Ihrer Kunden sicher.
      icon: i-lucide-shield-check
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: DSGVO-konform
      description: Die rechtlichen Anforderungen an Ihre Website werden erfüllt. Ich lasse Impressum, Datenschutzerklärung und Cookie-Hinweis von einer Kanzlei erstellen und binde Sie in die Seite ein.
      icon: i-lucide-laptop
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
steps:
  title: So läuft die [Transformation]{.text-primary} ab.
  description: ''
  items:
    - title: Kennlernen & Beratung
      description: Gemeinsam finden wir heraus, was Sie brauchen. Ich sammele alle Informationen, die ich für die Umsetzung benötige. Sie erhalten ein umfassendes Angebot.
      image: 
        src: '/images/Kennenlernen.png'
    - title: Konzeption & Design
      description: Nachdem ich ihre Zielgruppe und Ihre Ziele kenne, erstelle ich ein individuelles Design. Ich entwickle Texte, die Ihre Kunden ansprechen und überzeugen.
      image:
        src: '/images/Konzeption.png'
  
    - title: Technische Umsetzung
      description: Ich setze das Design technisch um. Ihre Website wird auf einem schnellen Server gehostet und mit einem SSL-Zertifikat ausgestattet.
      image:
        src: '/images/Umsetzung.png'
      
pricing:
  title: Ihre [Investition]{.text-primary}
  description: 'Die Kosten für Ihre Website-Transformation hängen natürlich von Ihren individuellen Anforderungen ab. Diese Festpreise sind als Orientierung gedacht.'
  plans:
    - title: Webtransformation
      description: ab 799€
      features:
        - Individuelles Webdesign
        - Responsives Layout
        - Suchmaschinenoptimierung (SEO)
        - Texterstellung
        - Domainumzug & SSL-Zertifikat
        - DSGVO-konform
      button:
        label: Beratung anfragen
        variant: solid
        to: '#'
    - title: Pflege & Wartung
      description: ab 99€/Monat
      features:
        - Regelmäßige Backups
        - Updates & Wartung
        - Kleine Inhaltsänderungen (z.B. Texte, Bilder)
        - Rechtstexte aktualisieren
      button:
        label: Beratung anfragen
        variant: solid
        to: '#'
testimonials:
  title: Hier einige [Kundenstimmen]{.text-primary}
  description: Die Zufriedenheit meiner Kunden steht für mich an erster Stelle. Hier einige Stimmen von Kunden, die mit mir zusammengearbeitet haben.
  items:
    - quote: Dreams2Code hat mir geholfen, meine Website zu optimieren und sie auf dem Handy zugänglich zu machen. Ich bin sehr zufrieden mit dem Ergebnis!
      user:
        name: Marie Kullmann
        description: Lummerland Kinderbetreuung
        target: _blank
    - quote: Die Erstellung meiner Website war ein großer Erfolg. Ich habe viele positive Rückmeldungen von meinen Kunden erhalten. Vielen Dank!
      user:
        name: Fabian Stauder
        description: Stauder Gartenpflege
        target: _blank
cta:
  title: Jetzt [Beratungsgespräch]{.text-primary} anfragen
  description: 'Ich freue mich darauf, Sie kennenzulernen und Ihre Website zu transformieren. Lassen Sie uns gemeinsam Ihre Ziele erreichen!'
  links:
    - label: zum Fragebogen
      icon: i-lucide-message-square-plus
      to: '#'
      target: _blank
